<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GreenBuddy 3D Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #F2F6F3; }
        #canvas-container { width: 100%; height: 100%; }
    </style>
    <!-- Local Three.js & GLTFLoader (Offline & Fast) -->
    <script src="three.min.js"></script>
    <script src="GLTFLoader.js"></script>
    <script src="OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xF2F6F3);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.4, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.6, 0);

        // Lighting setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(2, 4, 3);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight2.position.set(-2, 2, -2);
        scene.add(dirLight2);

        const gltfLoader = new THREE.GLTFLoader();

        let currentModel = null;
        let mixer = null;
        const clock = new THREE.Clock();

        function getGlbFileName(rawSpecies, rawStatus) {
            const speciesMap = {
                'aloe': 'aloe',
                'aloe vera': 'aloe',
                'cactus': 'aloe',
                'cactuse': 'aloe',
                'ficus': 'ficus',
                'pilea': 'pilea',
                'basilic': 'pilea',
                'basllic': 'pilea',
                'strelitzia': 'strelitzia',
                'monstera': 'strelitzia',
                'sansevieria': 'sansevieria',
                'pothos': 'sansevieria'
            };

            const statusMap = {
                'en_forme': 'sain',
                'sain': 'sain',
                'fresh': 'sain',
                'assoiffee': 'soif',
                'soif': 'soif',
                'withered': 'soif',
                'fletrie': 'fletri',
                'fletri': 'fletri',
                'dead': 'fletri'
            };

            const cleanSpecies = (rawSpecies || '').toLowerCase().trim();
            const cleanStatus = (rawStatus || '').toLowerCase().trim();

            const sp = speciesMap[cleanSpecies] || 'aloe';
            const st = statusMap[cleanStatus] || 'sain';

            return 'plante_' + sp + '_' + st + '.glb';
        }

        function loadGlbModel(fileName) {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer = null;
            }

            const modelPath = 'models/' + fileName;
            gltfLoader.load(modelPath, (gltf) => {
                currentModel = gltf.scene;

                // Center model and scale dynamically
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                currentModel.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const desiredScale = 2.4 / maxDim;
                    currentModel.scale.set(desiredScale, desiredScale, desiredScale);
                    currentModel.position.y += (size.y * desiredScale) * 0.1;
                }

                scene.add(currentModel);

                // 🎬 Automatic Animation Playback
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(currentModel);
                    gltf.animations.forEach((clip) => {
                        const action = mixer.clipAction(clip);
                        action.play();
                    });
                }
            }, undefined, (error) => {
                console.error('Error loading GLB file:', fileName, error);
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const speciesParam = urlParams.get('species') || 'aloe';
        const statusParam = urlParams.get('status') || 'sain';

        const glbFile = getGlbFileName(speciesParam, statusParam);
        loadGlbModel(glbFile);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
